name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint, format, typecheck and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: installerwindows_test
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d installerwindows_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Node version from package.json (volta)
        id: node_version
        run: echo "version=$(node -p "require('./package.json').volta.node")" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.version }}

      - name: Enable corepack
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm_store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env.test
        run: |
          cp .env.test.example .env.test
          APP_KEY=$(node ace generate:key --show | sed 's/^APP_KEY = //')
          sed -i "s#^APP_KEY=.*#APP_KEY=${APP_KEY}#" .env.test

      - name: Run checks
        run: pnpm run check
